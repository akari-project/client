# SPDX-License-Identifier: GPL-3.0-or-later
# client CI 骨架（spec/42 42.2）：make ci（SPDX 头、依赖许可证）与 REUSE lint。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make ci

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: fsfe/reuse-action@v5
